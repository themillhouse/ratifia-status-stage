owner: themillhouse
repo: ratifia-status-stage

# INTERNAL — stage monitoring only. GitHub Pages is intentionally NOT enabled
# on this repo; there is no published page. Upptime still runs the checks,
# commits history, and opens incident issues, which is all we want from stage.
#
# Stage belongs nowhere near status.ratifia.com: a customer seeing "Stage API
# down" learns nothing useful, and stage instability would drag the published
# prod uptime numbers. Upptime has no per-site "hide from page" option, so
# separating the environments means separating the repos.

sites:
  # Not behind the stage gate — the gate fronts the dashboard, not the API.
  - name: Stage API
    url: https://api.stage.ratifia.com/health
    maxResponseTime: 5000

  # app.stage.ratifia.com sits behind the Traefik stage gate, which 307s any
  # request without the `ratifia_stage` cookie to https://ratifia.com/stage.
  # The cookie token is supplied from an encrypted repo secret so the check can
  # pass the gate. As on prod, /sign-in is used rather than the root: Clerk's
  # auth.protect() answers a signed-out GET / with 404.
  - name: Stage Dashboard
    url: https://app.stage.ratifia.com/sign-in
    maxResponseTime: 8000
    headers:
      - "Cookie: ratifia_stage=$STAGE_COOKIE_TOKEN"

# Allowlist for $VAR substitution above. Set STAGE_COOKIE_TOKEN as a repository
# secret; it must equal the `stageToken` value in the Traefik rule
# (tf-do-resources apps/stage-ratifia).
secrets:
  - STAGE_COOKIE_TOKEN

status-website:
  # No `cname` and no Pages deployment — deliberately unpublished.
  name: Ratifia Stage (internal)
  introTitle: Ratifia Stage — internal monitoring
  introMessage: Internal stage monitoring. Not a customer-facing status page.

assignees:
  - Souvent22
